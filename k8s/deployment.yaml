apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-test
  template:
    metadata:
      labels:
        app: go-test
    spec:
      #initContainers:
      #  - name: wait-for-postgres
      #    image: go/test:1.0
      #    imagePullPolicy: Never
      #    command:
      #      - /bin/sh
      #      - -c
      #      - |
      #        echo "DB_HOST=$DB_HOST"
      #        echo "DB_PORT=$DB_PORT"
      #        while ! nc -z "$DB_HOST" "$DB_PORT"; do
      #          echo "Waiting for PostgreSQL..."
      #          sleep 2
      #        done
      #
      #        echo "PostgreSQL is available!"
      containers:
      - name: go-test
        image: go/test:1.0
        imagePullPolicy: Never
        ports:
         - containerPort: 8080
        #command: ["go", "run", "main.go"] 
        #command: ["air"] 
        env:
          - name: DB_HOST
            valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_HOST
          - name: DB_PORT
            valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PORT
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_USER

          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_PASSWORD

          - name: DB_NAME
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_DB
        workingDir: /projects/go
        volumeMounts:
            - name: source
              mountPath: /projects/go
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Waiting for PostgreSQL..."
            echo "DB_HOST=$DB_HOST"
            echo "DB_PORT=$DB_PORT"

            until nc -z "$DB_HOST" "$DB_PORT"; do
              echo "PostgreSQL is not ready - waiting..."
              sleep 2
            done

            echo "PostgreSQL is available!"
            exec air -c /projects/go/.air.toml
      volumes:
        - name: source
          hostPath:
            path: /projects/go
            type: Directory  