apiVersion: batch/v1
kind: Job
metadata:
  name: go-migrations
spec:
  backoffLimit: 5

  template:
    spec:
      restartPolicy: OnFailure

      containers:
        - name: migration
          image: go/test:1.0
          imagePullPolicy: Never
          command:
            - goose
          args:
            - "-dir"
            - "/projects/go/migration"
            - "postgres"
            - "postgres://$(DB_USER):$(DB_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(DB_NAME)?sslmode=disable"
            - "up"

          env:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_HOST

            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PORT

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
          volumeMounts:
            - name: source
              mountPath: /projects/go        
      volumes:
        - name: source
          hostPath:
            path: /projects/go
            type: Directory        